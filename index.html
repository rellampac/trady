<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trady">
<meta name="theme-color" content="#3fb950">
<title>Trady Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#06090f;--card:#0a1018;--border:rgba(255,255,255,.06);
  --text:#e6edf3;--muted:#6e7681;--green:#3fb950;--green-bg:rgba(63,185,80,.08);
  --blue:#58a6ff;--purple:#bc8cff;--orange:#f0883e;--red:#f85149;--yellow:#e3b341;
  --font:'JetBrains Mono',monospace;--font-head:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
::selection{background:var(--green);color:var(--bg)}

/* HEADER */
header{background:linear-gradient(135deg,#0b1a2e 0%,#0b1e12 50%,#160b24 100%);
  padding:20px 24px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;
  backdrop-filter:blur(20px)}
header h1{font-family:var(--font-head);font-size:1.15rem;font-weight:700;
  background:linear-gradient(90deg,var(--green),var(--blue),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:linear-gradient(135deg,#238636,#1a6b2e);color:#fff;
  font-size:.65rem;padding:3px 10px;border-radius:12px;font-weight:700;letter-spacing:.03em}
#ts{margin-left:auto;font-size:.7rem;color:var(--muted)}
#loadStatus{font-size:.7rem;color:var(--orange);margin-left:8px}

/* LAYOUT */
.wrap{padding:16px;max-width:1440px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent,linear-gradient(90deg,var(--green),var(--blue)))}
.card h3{font-family:var(--font-head);font-size:.72rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;font-weight:600}

/* BROKER HEADERS */
.broker-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;
  padding:12px 16px;border-radius:10px}
.broker-qf{background:rgba(63,185,80,.06);border:1px solid rgba(63,185,80,.15)}
.broker-ibkr{background:rgba(227,179,65,.06);border:1px solid rgba(227,179,65,.15)}
.broker-total{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.15)}.broker-bitunix{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.15)}
.broker-label{font-family:var(--font-head);font-size:.9rem;font-weight:700}

/* STAT GRID */
.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stat{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;
  padding:12px 8px;text-align:center;transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.12)}
.stat .ico{font-size:1.4rem;margin-bottom:4px}
.stat .l{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.stat .v{font-family:var(--font);font-size:1.05rem;font-weight:800}

/* GRID LAYOUTS */
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
canvas{max-height:280px}

/* PILLS */
.pill{display:inline-block;padding:2px 7px;border-radius:20px;font-size:.62rem;font-weight:700;letter-spacing:.02em}
.pill-s{background:rgba(88,166,255,.12);color:var(--blue)}
.pill-c{background:rgba(188,140,255,.12);color:var(--purple)}
.pill-f{background:rgba(240,136,62,.12);color:var(--orange)}
.pill-fx{background:rgba(63,185,80,.12);color:var(--green)}
.pill-qf{background:rgba(63,185,80,.12);color:var(--green)}
.pill-ibkr{background:rgba(227,179,65,.12);color:var(--yellow)}.pill-bitunix{background:rgba(88,166,255,.12);color:var(--blue)}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);
  font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
tr:hover td{background:rgba(255,255,255,.02)}

/* FILTERS */
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fi{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);
  padding:7px 12px;border-radius:8px;font-size:.78rem;outline:none;font-family:var(--font)}
.fi:focus{border-color:var(--green)}

/* BUTTONS */
.bg{background:linear-gradient(135deg,#238636,#2ea043);color:#fff;border:none;
  padding:9px 18px;border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;font-family:var(--font)}
.bg:hover{filter:brightness(1.1)}
.bd{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:9px 18px;border-radius:8px;cursor:pointer;font-size:.8rem;font-family:var(--font)}

/* PAGINATION */
.pag{display:flex;gap:4px;align-items:center;margin-top:10px;justify-content:flex-end;
  font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.pb{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:var(--text);
  padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.72rem}
.pb.on{background:rgba(63,185,80,.15);border-color:var(--green);color:var(--green)}

/* ASSET LIST */
.ai{display:flex;justify-content:space-between;align-items:center;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.04);font-size:.82rem}
.ai:last-child{border-bottom:none}

/* TOPBAR */
.topbar{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px 16px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* MODAL */
.ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.75);z-index:99;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.ov.on{display:flex}
.mo{background:#0d1117;border:1px solid rgba(255,255,255,.1);border-radius:16px;
  padding:24px;width:440px;max-width:95vw;max-height:90vh;overflow-y:auto}
.mo h3{font-family:var(--font-head);font-size:.95rem;margin-bottom:16px;font-weight:700}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:3px;font-weight:600}
.fg input,.fg select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);
  color:var(--text);padding:8px 12px;border-radius:8px;font-size:.82rem;outline:none;font-family:var(--font)}
.ma{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

/* LOADING */
.loader{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:900px){.sgrid{grid-template-columns:repeat(3,1fr)}.row2,.row2b{grid-template-columns:1fr}}
@media(max-width:600px){.sgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <span style="font-size:1.5rem">📈</span>
  <h1>Trady Dashboard — Oscar</h1>
  <span class="badge">2026</span>
  <span id="loadStatus"></span>
  <span id="ts"></span>
</header>

<div class="wrap" id="main">
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div style="color:var(--muted);font-size:.82rem">Cargando datos desde Google Sheets...</div>
  </div>
</div>

<div class="ov" id="modal">
  <div class="mo">
    <h3>➕ Añadir operación</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg"><label>Símbolo</label><input id="mS" placeholder="TSLA, BTC/USDT..."></div>
      <div class="fg"><label>Broker</label><select id="mBrok"><option value="qf">🟢 Quantfury</option><option value="ibkr">🟡 IBKR</option><option value="bitunix">🔵 Bitunix</option></select></div>
      <div class="fg"><label>Tipo</label><select id="mT"><option value="stock">Acción/ETF</option><option value="crypto">Crypto</option><option value="futures">Futuro</option><option value="forex">Forex</option></select></div>
      <div class="fg"><label>Fecha</label><input type="date" id="mD"></div>
    </div>
    <div class="fg"><label>📊 P&L (USD)</label><input id="mP" type="number" step="0.01" placeholder="55.20 o -30.00"></div>
    <div class="ma">
      <button class="bd" onclick="closeM()">Cancelar</button>
      <button class="bg" onclick="addM()">Guardar (local)</button>
    </div>
    <div style="margin-top:10px;font-size:.68rem;color:var(--muted)">⚠️ Los trades añadidos aquí se guardan en localStorage del navegador. Para persistencia permanente, pídele a Claude que los añada al Sheet.</div>
  </div>
</div>

<script>
// ========== CONFIGURATION ==========
var SHEET_ID = "12lShXuI_hwsBXua4Bmnj_DV6K49y4_-ag7AqIWgDpmE";
var CAP_QF = 2100, CAP_IBKR = 6350, CAP_BITUNIX = 279;
var AJUSTE_SYMS = ["AJUSTE", "AJUSTE_MAYO"];
var CONFIG_SYMS = ["CONFIG_QF", "CONFIG_IBKR", "CONFIG_BITUNIX"];

// ========== GLOBALS ==========
var trades = [], extras = [], target = 0;
var eC = null, wC = null, mC = null, wkC = null, distC = null;
var pg = 1, PER = 10;
var calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
var MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// ========== LOAD FROM SHEET ==========
function processSheetData(data) {
  var rows = data.table.rows;
  trades = [];
  for (var i = 0; i < rows.length; i++) {
    var c = rows[i].c;
    if (!c || !c[0]) continue;
    var sym = (c[0] && c[0].v) ? String(c[0].v).trim() : "";
    var date = (c[1] && c[1].v) ? String(c[1].v).trim() : "";
    // Handle Google Sheets date format "Date(2026,0,3)"
    if (date.indexOf("Date(") === 0) {
      var parts = date.replace("Date(","").replace(")","").split(",");
      var y = parts[0], m = parseInt(parts[1])+1, d = parseInt(parts[2]);
      date = y + "-" + (m<10?"0":"") + m + "-" + (d<10?"0":"") + d;
    }
    var pnl = (c[2] && c[2].v !== null) ? parseFloat(c[2].v) : 0;
    var type = (c[3] && c[3].v) ? String(c[3].v).trim() : "stock";
    var broker = (c[4] && c[4].v) ? String(c[4].v).trim() : "qf";
    if (sym) trades.push({ sym: sym, date: date, pnl: pnl, type: type, broker: broker, src: "sheet" });
  }
  // Read CONFIG rows and set capitals
  trades.forEach(function(t) {
    if (t.sym === "CONFIG_QF") CAP_QF = t.pnl;
    else if (t.sym === "CONFIG_IBKR") CAP_IBKR = t.pnl;
    else if (t.sym === "CONFIG_BITUNIX") CAP_BITUNIX = t.pnl;
  });
  // Remove CONFIG rows from trades
  trades = trades.filter(function(t) { return CONFIG_SYMS.indexOf(t.sym) === -1; });
  // Add localStorage extras
  try { extras = JSON.parse(localStorage.getItem("trady_extras") || "[]"); } catch(e) { extras = []; }
  extras.forEach(function(t) { trades.push(t); });
  try { target = parseFloat(localStorage.getItem("trady_target") || "0"); } catch(e) { target = 0; }
  document.getElementById("loadStatus").textContent = trades.length + " trades cargados";
  buildUI();
  go();
}

function showError(msg) {
  document.getElementById("loader").innerHTML =
    "<div style='color:var(--red);font-size:.9rem'>❌ Error cargando datos</div>" +
    "<div style='color:var(--muted);font-size:.78rem;margin-top:8px'>" + msg + "</div>" +
    "<div style='color:var(--muted);font-size:.72rem;margin-top:12px'>Verifica que el Sheet esté compartido como \"Cualquier persona con el enlace\"</div>";
}

// Set up the JSONP callback
window.__tradySheetCallback = function(data) {
  try { processSheetData(data); }
  catch(e) { showError(e.message); }
};

function loadSheet() {
  // Remove any previous script tag
  var old = document.getElementById("sheetScript");
  if (old) old.remove();
  // Reset UI
  document.getElementById("loadStatus").textContent = "Cargando...";
  // Use JSONP via script tag — no CORS issues, works from file://
  var script = document.createElement("script");
  script.id = "sheetScript";
  script.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:json;responseHandler:__tradySheetCallback";
  script.onerror = function() { showError("No se pudo conectar con Google Sheets"); };
  document.head.appendChild(script);
}

// ========== HELPERS ==========
function f(v) {
  return (v >= 0 ? "+" : "−") + "$" + Math.abs(v).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function typePill(t) {
  var m = { stock: "pill-s", crypto: "pill-c", futures: "pill-f", forex: "pill-fx" };
  return m[t] || "pill-s";
}
function statCard(ico, l, v, colorClass) {
  return "<div class='stat " + colorClass + "'><div class='ico'>" + ico + "</div><div class='l'>" + l + "</div><div class='v'>" + v + "</div></div>";
}

// ========== COMPUTE BROKER STATS ==========
function computeStats(tradeList, capital) {
  var real = tradeList.filter(function(x) { return AJUSTE_SYMS.indexOf(x.sym) === -1; });
  var ajuste = tradeList.filter(function(x) { return AJUSTE_SYMS.indexOf(x.sym) !== -1; })
    .reduce(function(a, b) { return a + b.pnl; }, 0);
  var tot = real.reduce(function(a, b) { return a + b.pnl; }, 0) + ajuste;
  var saldo = capital + tot;
  var wins = real.filter(function(x) { return x.pnl > 0; });
  var losses = real.filter(function(x) { return x.pnl < 0; });
  var wr = real.length ? (wins.length / real.length * 100).toFixed(1) : "0.0";
  var pct = capital > 0 ? (tot / capital * 100).toFixed(1) : "0.0";
  var best = real.length ? real.reduce(function(a, b) { return b.pnl > a.pnl ? b : a; }) : null;
  var worst = real.length ? real.reduce(function(a, b) { return b.pnl < a.pnl ? b : a; }) : null;
  var avgW = wins.length ? wins.reduce(function(a, b) { return a + b.pnl; }, 0) / wins.length : 0;
  var avgL = losses.length ? Math.abs(losses.reduce(function(a, b) { return a + b.pnl; }, 0) / losses.length) : 0;
  var totW = wins.reduce(function(a, b) { return a + b.pnl; }, 0);
  var totL = Math.abs(losses.reduce(function(a, b) { return a + b.pnl; }, 0));
  var factor = totL > 0 ? (totW / totL).toFixed(2) : "∞";

  // Streaks — computed dynamically (P&L=0 is neutral, doesn't break streaks)
  var maxW = 0, maxL = 0, curW = 0, curL = 0;
  real.forEach(function(x) {
    if (x.pnl > 0) { curW++; curL = 0; if (curW > maxW) maxW = curW; }
    else if (x.pnl < 0) { curL++; curW = 0; if (curL > maxL) maxL = curL; }
    // pnl === 0: neutral, don't reset streaks
  });

  // Current streak (skip P&L=0 trades)
  var racha = 0, rachaDir = 0;
  for (var i = real.length - 1; i >= 0; i--) {
    var p = real[i].pnl;
    if (p === 0) continue; // skip neutrals
    if (rachaDir === 0) { rachaDir = p > 0 ? 1 : -1; racha = 1; }
    else if ((p > 0 && rachaDir === 1) || (p < 0 && rachaDir === -1)) { racha++; }
    else break;
  }

  // Max drawdown
  var peak = 0, dd = 0, maxDD = 0;
  var sorted = real.slice().sort(function(a, b) { return (a.date || "").localeCompare(b.date || ""); });
  sorted.forEach(function(x) {
    dd += x.pnl;
    if (dd > peak) peak = dd;
    var c = peak - dd;
    if (c > maxDD) maxDD = c;
  });

  // Days positive
  var byDay = {};
  real.forEach(function(x) { if (x.date) { byDay[x.date] = (byDay[x.date] || 0) + x.pnl; } });
  var daysArr = Object.values(byDay);
  var daysPos = daysArr.filter(function(v) { return v > 0; }).length;
  var daysPct = daysArr.length ? (daysPos / daysArr.length * 100).toFixed(0) + "%" : "--";

  // Monthly breakdown
  var nowM = new Date().toISOString().substring(0, 7);
  var thisMon = real.filter(function(x) { return (x.date || "").substring(0, 7) === nowM; }).length;
  var bm = {};
  real.filter(function(x) { return x.date >= "2026-01-01"; }).forEach(function(x) {
    var m = (x.date || "").substring(0, 7);
    bm[m] = (bm[m] || 0) + x.pnl;
  });
  var ml = Object.keys(bm).sort();
  var md = ml.map(function(k) { return parseFloat(bm[k].toFixed(2)); });
  var avgM = ml.length > 0 ? md.reduce(function(a, b) { return a + b; }, 0) / ml.length : 0;
  var tradesPerMonth = ml.length > 0 ? (real.filter(function(x) { return x.date >= "2026-01-01"; }).length / ml.length).toFixed(1) : "0";

  return {
    real: real, ajuste: ajuste, tot: tot, saldo: saldo, peak: peak,
    wins: wins, losses: losses, wr: wr, pct: pct,
    best: best, worst: worst, avgW: avgW, avgL: avgL,
    factor: factor, maxW: maxW, maxL: maxL,
    racha: racha, rachaDir: rachaDir, maxDD: maxDD,
    daysPct: daysPct, thisMon: thisMon, avgM: avgM,
    tradesPerMonth: tradesPerMonth, capital: capital,
    bm: bm, ml: ml, md: md, byDay: byDay, sorted: sorted
  };
}

function renderStatGrid(s, colPrefix) {
  var c1 = colPrefix === "qf" ? "c1" : (colPrefix === "ibkr" ? "c6" : (colPrefix === "bitunix" ? "c2" : "c2"));
  var saldoLabel = colPrefix === "qf" ? "Saldo QF" : (colPrefix === "ibkr" ? "Saldo IBKR" : (colPrefix === "bitunix" ? "Saldo Bitunix" : "Saldo Total"));
  var pnlLabel = colPrefix === "qf" ? "P&L QF" : (colPrefix === "ibkr" ? "P&L IBKR" : (colPrefix === "bitunix" ? "P&L Bitunix" : "P&L Total"));
  var capLabel = colPrefix === "total" ? "Capital total" : "Capital ini.";
  return [
    statCard("💰", saldoLabel, "$" + s.saldo.toLocaleString("es-ES", {minimumFractionDigits:2, maximumFractionDigits:2}), c1 + " stat"),
    statCard("📈", pnlLabel, f(s.tot), (s.tot >= 0 ? "c1" : "c5") + " stat"),
    statCard("🚀", "% Capital", (s.tot >= 0 ? "+" : "") + s.pct + "%", (s.tot >= 0 ? "c1" : "c5") + " stat"),
    statCard("📅", "Media/mes", f(s.avgM), (s.avgM >= 0 ? "c1" : "c5") + " stat"),
    statCard("🎯", "Win Rate", s.wr + "%", (parseFloat(s.wr) >= 50 ? "c1" : "c5") + " stat"),
    statCard("⭐", "Mejor", s.best ? f(s.best.pnl) : "--", "c1 stat"),
    statCard("💥", "Peor", s.worst ? f(s.worst.pnl) : "--", "c5 stat"),
    statCard("💚", "Prom. win", f(s.avgW), "c1 stat"),
    statCard("🔴", "Prom. loss", "−$" + s.avgL.toFixed(2), "c5 stat"),
    statCard("⚦️", "Factor", s.factor, (parseFloat(s.factor) >= 1 ? "c1" : "c5") + " stat"),
    statCard("📉", "Drawdown", "−$" + s.maxDD.toFixed(0) + " / −" + (s.capital + Math.max(0,s.peak) > 0 ? (s.maxDD/(s.capital+Math.max(0,s.peak))*100).toFixed(1) : "0") + "%", "c5 stat"),
    statCard("🔥", "Racha actual", (s.rachaDir === 1 ? "+" : "−") + s.racha + " seg.", (s.rachaDir === 1 ? "c1" : "c5") + " stat"),
    statCard("🏆", "Racha win", s.maxW + " trades", "c1 stat"),
    statCard("⛔", "Racha loss", s.maxL + " trades", "c5 stat"),
    statCard("☀️", "Días pos.", s.daysPct, (parseInt(s.daysPct) >= 50 ? "c1" : "c5") + " stat"),
    statCard("🗓️", "Trades mes", s.thisMon + " ops", "c2 stat"),
    statCard("🔢", "Media/mes", s.tradesPerMonth + " ops", "c2 stat"),
    statCard("🏦", capLabel, "$" + s.capital.toLocaleString("es-ES"), "c3 stat")
  ].join("");
}

// ========== BUILD UI ==========
function buildUI() {
  document.getElementById("main").innerHTML = `
  <div class="topbar">
    <button class="bg" onclick="openM()">+ Añadir trade</button>
    <button class="bd" onclick="delLast()">↩ Deshacer último</button>
    <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}" target="_blank" class="bd" style="text-decoration:none">📊 Abrir Sheet</a>

// ========== MAIN RENDER ==========
function go() {
  var allT = trades.slice().sort(function(a,b){return(a.date||"").localeCompare(b.date||"");});
  var qfT = allT.filter(function(x){return x.broker==="qf";});
  var ibkrT = allT.filter(function(x){return x.broker==="ibkr";});
  var bitunixT = allT.filter(function(x){return x.broker==="bitunix";});

  var sqf = computeStats(qfT, CAP_QF);
  var sibkr = computeStats(ibkrT, CAP_IBKR);
  var sbitunix = computeStats(bitunixT, CAP_BITUNIX);
  var stot = computeStats(allT, CAP_QF + CAP_IBKR + CAP_BITUNIX);

  document.getElementById("sg-qf").innerHTML = renderStatGrid(sqf, "qf");
  document.getElementById("sg-ibkr").innerHTML = renderStatGrid(sibkr, "ibkr");
  document.getElementById("sg-bitunix").innerHTML = renderStatGrid(sbitunix, "bitunix");
  document.getElementById("sg-total").innerHTML = renderStatGrid(stot, "total");

  // ===== EQUITY CURVE =====
  var cum = stot.ajuste, elabs = [], edata = [];
  stot.sorted.forEach(function(x) {
    cum += x.pnl;
    elabs.push(x.date);
    edata.push(parseFloat(cum.toFixed(2)));
  });
  if (eC) eC.destroy();
  eC = new Chart(document.getElementById("ec"), {
    type: "line",
    data: { labels: elabs, datasets: [{ data: edata, borderColor: "#3fb950", backgroundColor: function(ctx) {
      var chart = ctx.chart; var area = chart.chartArea; if (!area) return "rgba(63,185,80,.15)";
      var grad = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
      grad.addColorStop(0, "rgba(63,185,80,.35)"); grad.addColorStop(1, "rgba(63,185,80,.02)"); return grad;
    }, fill: true, tension: .3, pointRadius: 0, borderWidth: 3 }] },
    options: { responsive: true, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: "#6e7681", maxTicksLimit: 8, font: { size: 10 } }, grid: { color: "rgba(255,255,255,.04)" } },
               y: { ticks: { color: "#6e7681", font: { size: 10 }, callback: function(v){return "$"+v;} }, grid: { color: "rgba(255,255,255,.04)" } } } }
  });

  // ===== WIN/LOSS DOUGHNUT =====
  if (wC) wC.destroy();
  wC = new Chart(document.getElementById("wc"), {
    type: "doughnut",
    data: { labels: ["Ganadores (" + stot.wins.length + ")", "Perdedores (" + stot.losses.length + ")"],
      datasets: [{ data: [stot.wins.length, stot.losses.length], backgroundColor: ["#1a4d2e", "#4d2a0d"], borderColor: ["#3fb950", "#f0883e"], borderWidth: 2 }] },
    options: { responsive: true, plugins: { legend: { position: "bottom", labels: { color: "#8b949e", padding: 14, font: { size: 11 } } } } }
  });

  // ===== MONTHLY BAR =====
  if (mC) mC.destroy();
  mC = new Chart(document.getElementById("mc"), {
    type: "bar",
    data: { labels: stot.ml, datasets: [{ data: stot.md, backgroundColor: stot.md.map(function(v){return v>=0?"rgba(63,185,80,.7)":"rgba(240,136,62,.7)";}), borderRadius: 6 }] },
    options: { responsive: true, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: "#6e7681", font: { size: 10 } }, grid: { color: "rgba(255,255,255,.03)" } },
               y: { ticks: { color: "#6e7681", font: { size: 10 }, callback: function(v){return "$"+v;} }, grid: { color: "rgba(255,255,255,.03)" } } } }
  });

  // ===== WEEKLY BAR =====
  var bw = {};
  stot.real.filter(function(x){return x.date>="2026-01-01";}).forEach(function(x) {
    var d2 = new Date(x.date), jan1 = new Date(d2.getFullYear(), 0, 1);
    var wk = Math.ceil(((d2 - jan1) / 86400000 + jan1.getDay() + 1) / 7);
    var key = "W" + (wk < 10 ? "0" : "") + wk;
    bw[key] = (bw[key] || 0) + x.pnl;
  });
  var wkL = Object.keys(bw).sort(), wkD = wkL.map(function(k){return parseFloat(bw[k].toFixed(2));});
  if (wkC) wkC.destroy();
  wkC = new Chart(document.getElementById("wkc"), {
    type: "bar",
    data: { labels: wkL, datasets: [{ data: wkD, backgroundColor: wkD.map(function(v){return v>=0?"rgba(227,179,65,.7)":"rgba(240,136,62,.7)";}), borderRadius: 5 }] },
    options: { responsive: true, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: "#6e7681", font: { size: 9 }, maxTicksLimit: 20 }, grid: { color: "rgba(255,255,255,.03)" } },
               y: { ticks: { color: "#6e7681", font: { size: 10 }, callback: function(v){return "$"+v;} }, grid: { color: "rgba(255,255,255,.03)" } } } }
  });

  // ===== DISTRIBUTION =====
  var bk = {"<−200":0,"−200/−50":0,"−50/0":0,"0/50":0,"50/200":0,">200":0};
  stot.real.forEach(function(x) {
    var p = x.pnl;
    if(p<-200)bk["<−200"]++;else if(p<-50)bk["−200/−50"]++;else if(p<0)bk["−50/0"]++;
    else if(p<50)bk["0/50"]++;else if(p<200)bk["50/200"]++;else bk[">200"]++;
  });
  if (distC) distC.destroy();
  distC = new Chart(document.getElementById("distc"), {
    type: "bar",
    data: { labels: Object.keys(bk), datasets: [{ data: Object.values(bk),
      backgroundColor: ["rgba(240,136,62,.8)","rgba(240,136,62,.5)","rgba(240,136,62,.3)","rgba(63,185,80,.3)","rgba(63,185,80,.5)","rgba(63,185,80,.8)"], borderRadius: 5 }] },
    options: { responsive: true, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: "#6e7681", font: { size: 9 } }, grid: { color: "rgba(255,255,255,.03)" } },
               y: { ticks: { color: "#6e7681", font: { size: 10 } }, grid: { color: "rgba(255,255,255,.03)" } } } }
  });

  // ===== TOP 5 ASSETS =====
  var ba = {};
  stot.real.forEach(function(x) {
    if (!ba[x.sym]) ba[x.sym] = { pnl: 0, n: 0, type: x.type };
    ba[x.sym].pnl += x.pnl; ba[x.sym].n++;
  });
  var sa = Object.entries(ba).sort(function(a,b){return b[1].pnl-a[1].pnl;}).slice(0,5);
  document.getElementById("al").innerHTML = sa.map(function(e) {
    var s = e[0], v = e[1];
    return "<div class='ai'><div><strong>" + s + "</strong><span class='pill " + typePill(v.type) + "' style='margin-left:6px'>" + v.type + "</span> <span style='color:var(--muted);font-size:.68rem'>" + v.n + " ops</span></div><div style='font-weight:800;color:" + (v.pnl >= 0 ? "var(--green)" : "var(--orange)") + "'>" + f(v.pnl) + "</div></div>";
  }).join("");

  // ===== MONTHLY SUMMARY TABLE =====
  var mdata = {};
  stot.real.filter(function(x){return x.date>="2026-01-01";}).forEach(function(x) {
    var m = (x.date||"").substring(0,7);
    if(!mdata[m]) mdata[m] = {pnl:0,n:0,w:0,best:-Infinity,worst:Infinity};
    mdata[m].pnl += x.pnl; mdata[m].n++;
    if(x.pnl>0) mdata[m].w++;
    if(x.pnl>mdata[m].best) mdata[m].best=x.pnl;
    if(x.pnl<mdata[m].worst) mdata[m].worst=x.pnl;
  });
  var mKeys = Object.keys(mdata).sort();
  var runBal = CAP_QF + CAP_IBKR + CAP_BITUNIX + stot.ajuste;
  mKeys.forEach(function(k){ mdata[k].startBal = runBal; runBal += mdata[k].pnl; });
  document.getElementById("monthTable").innerHTML = "<table><thead><tr><th>Mes</th><th>Trades</th><th>Win%</th><th>P&L</th><th>Rent.%</th><th>Mejor</th><th>Peor</th></tr></thead><tbody>" +
    mKeys.map(function(k) {
      var m = mdata[k]; var col = m.pnl >= 0 ? "var(--green)" : "var(--orange)";
      var rp = m.startBal > 0 ? (m.pnl / m.startBal * 100).toFixed(1) + "%" : "--";
      return "<tr><td><strong>" + k + "</strong></td><td style='color:var(--muted)'>" + m.n + "</td><td style='color:var(--yellow)'>" + (m.w/m.n*100).toFixed(0) + "%</td><td style='font-weight:800;color:" + col + "'>" + f(m.pnl) + "</td><td style='font-weight:700;color:var(--yellow)'>" + (m.pnl>=0?"+":"") + rp + "</td><td style='color:var(--green)'>" + f(m.best) + "</td><td style='color:var(--orange)'>" + f(m.worst) + "</td></tr>";
    }).join("") + "</tbody></table>";

  // HEATMAP
  drawHeatmap(stot.byDay);
  // CALENDAR
  drawCal();
  // TARGET
  drawTarget();
  // TABLE
  tbl();
  // TIMESTAMP
  document.getElementById("ts").textContent = "Actualizado: " + new Date().toLocaleString("es-ES");
}

// ========== CALENDAR ==========
function drawCal() {
  document.getElementById("calTitle").textContent = MONTHS[calMonth] + " " + calYear;
  var byDay = {};
  var mm = (calMonth + 1 < 10 ? "0" : "") + (calMonth + 1);
  trades.forEach(function(t) {
    if ((t.date || "").substring(0, 7) === calYear + "-" + mm) {
      var d = parseInt(t.date.substring(8, 10));
      byDay[d] = (byDay[d] || 0) + t.pnl;
    }
  });
  var first = new Date(calYear, calMonth, 1).getDay();
  var offset = (first === 0) ? 6 : first - 1;
  var days = new Date(calYear, calMonth + 1, 0).getDate();
  var today = new Date();
  var html = "";
  for (var i = 0; i < offset; i++) html += "<div></div>";
  for (var d = 1; d <= days; d++) {
    var isToday = (today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === d);
    var pnl = byDay[d];
    var hasPnl = (pnl !== undefined);
    var bg = hasPnl ? (pnl >= 0 ? "linear-gradient(135deg,#0d2818,#0f3520)" : "linear-gradient(135deg,#2d1a0e,#3a1f0a)") : "rgba(255,255,255,.02)";
    var fc = hasPnl ? (pnl >= 0 ? "var(--green)" : "var(--orange)") : "var(--muted)";
    var border = isToday ? "2px solid var(--green)" : "1px solid var(--border)";
    html += "<div style='background:" + bg + ";border:" + border + ";border-radius:10px;padding:8px 4px;min-height:56px;text-align:center'>";
    html += "<div style='font-size:.78rem;color:" + (isToday ? "var(--green)" : "var(--text)") + ";font-weight:" + (isToday ? "700" : "400") + "'>" + d + "</div>";
    if (hasPnl) html += "<div style='font-size:.65rem;font-weight:700;color:" + fc + ";margin-top:2px'>" + (pnl >= 0 ? "+" : "") + pnl.toFixed(0) + "</div>";
    html += "</div>";
  }
  document.getElementById("calGrid").innerHTML = html;
}

// ========== HEATMAP ==========
function drawHeatmap(byDayMap) {
  var mL = ["E","F","M","A","M","J","J","A","S","O","N","D"];
  var html = "<div style='display:flex;gap:3px;align-items:flex-start'>";
  html += "<div style='display:flex;flex-direction:column;gap:2px;padding-top:18px'>";
  ["L","M","X","J","V","S","D"].forEach(function(d) {
    html += "<div style='font-size:.58rem;color:var(--muted);height:13px;line-height:13px;width:10px'>" + d + "</div>";
  });
  html += "</div>";
  var d = new Date(2026, 0, 1);
  var off = (d.getDay() === 0) ? 6 : d.getDay() - 1;
  var weeks = [], wk = [];
  for (var i = 0; i < off; i++) wk.push(null);
  while (d.getFullYear() === 2026) {
    var key = d.toISOString().split("T")[0];
    wk.push({ date: key, pnl: byDayMap[key] });
    if (wk.length === 7) { weeks.push(wk); wk = []; }
    d.setDate(d.getDate() + 1);
  }
  if (wk.length) weeks.push(wk);
  var curM = -1;
  weeks.forEach(function(week) {
    html += "<div style='display:flex;flex-direction:column;gap:2px'>";
    var fr = null;
    for (var i = 0; i < week.length; i++) { if (week[i] && week[i].date) { fr = week[i]; break; } }
    var mIdx = fr ? parseInt(fr.date.substring(5, 7)) - 1 : -1;
    html += "<div style='font-size:.58rem;color:var(--muted);height:14px;text-align:center;width:13px'>" +
      (mIdx >= 0 && mIdx !== curM ? (curM = mIdx, mL[mIdx]) : "") + "</div>";
    week.forEach(function(cell) {
      if (!cell) { html += "<div style='width:13px;height:13px;border-radius:3px'></div>"; return; }
      var td = new Date().toISOString().split("T")[0];
      var isFuture = cell.date > td;
      var bg = "rgba(255,255,255,.03)";
      if (!isFuture && cell.pnl !== undefined) bg = cell.pnl >= 0 ? "#1e6b3a" : "#6b2a0d";
      html += "<div style='background:" + bg + ";width:13px;height:13px;border-radius:3px' title='" +
        cell.date + (cell.pnl !== undefined ? " " + (cell.pnl >= 0 ? "+" : "") + cell.pnl.toFixed(0) + "$" : "") + "'></div>";
    });
    html += "</div>";
  });
  html += "</div>";
  document.getElementById("heatmap").innerHTML = html;
}

// ========== TARGET ==========
function setTarget() {
  var v = parseFloat(document.getElementById("targetInput").value);
  if (isNaN(v) || v <= 0) { alert("Valor inválido"); return; }
  target = v;
  try { localStorage.setItem("trady_target", String(v)); } catch(e) {}
  drawTarget();
}
function drawTarget() {
  var el = document.getElementById("targetBar");
  if (!target) { el.innerHTML = "<div style='color:var(--muted);font-size:.82rem'>Introduce un target mensual.</div>"; return; }
  var nowM = new Date().toISOString().substring(0, 7);
  var mpQF = trades.filter(function(x){return(x.date||"").substring(0,7)===nowM&&x.broker==="qf"&&AJUSTE_SYMS.indexOf(x.sym)===-1;}).reduce(function(a,b){return a+b.pnl;},0);
  var mpIBKR = trades.filter(function(x){return(x.date||"").substring(0,7)===nowM&&x.broker==="ibkr"&&AJUSTE_SYMS.indexOf(x.sym)===-1;}).reduce(function(a,b){return a+b.pnl;},0);
  var mpBTX = trades.filter(function(x){return(x.date||"").substring(0,7)===nowM&&x.broker==="bitunix"&&AJUSTE_SYMS.indexOf(x.sym)===-1;}).reduce(function(a,b){return a+b.pnl;},0);
  var mp = mpQF + mpIBKR + mpBTX;
  var pct = Math.min(100, Math.max(0, mp / target * 100));
  var col = mp >= target ? "var(--green)" : (mp >= 0 ? "var(--yellow)" : "var(--orange)");
  el.innerHTML = "<div style='display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:8px'><span>Este mes: <strong style='color:" + col + "'>" + f(mp) + "</strong></span><span style='color:var(--muted)'>Target: <strong style='color:var(--text)'>$" + target.toLocaleString("es-ES") + "</strong></span></div>" +
    "<div style='display:flex;gap:10px;font-size:.75rem;margin-bottom:8px'><span>🟢 QF: <strong style='color:var(--green)'>" + f(mpQF) + "</strong></span><span>🟡 IBKR: <strong style='color:var(--yellow)'>" + f(mpIBKR) + "</strong></span><span>🔵 BTX: <strong style='color:var(--blue)'>" + f(mpBTX) + "</strong></span></div>" +
    "<div style='background:rgba(255,255,255,.05);border-radius:20px;height:14px;overflow:hidden'><div style='background:" + col + ";width:" + pct + "%;height:100%;border-radius:20px;transition:width .5s'></div></div>" +
    "<div style='font-size:.72rem;color:var(--muted);margin-top:6px'>" + pct.toFixed(1) + "% completado" + (mp >= target ? " 🎯 META ALCANZADA" : "") + "</div>";
  document.getElementById("targetInput").value = target;
}

// ========== HISTORY TABLE ==========
function tbl() {
  var sym = document.getElementById("fS").value.toLowerCase();
  var typ = document.getElementById("fT").value;
  var brk = document.getElementById("fBrok").value;
  var res = document.getElementById("fR").value;
  var fa = document.getElementById("fA").value;
  var fb = document.getElementById("fZ").value;
  var fl = trades.filter(function(x) { return AJUSTE_SYMS.indexOf(x.sym) === -1; })
    .slice().sort(function(a,b) { return (b.date||"").localeCompare(a.date||""); });
  if (sym) fl = fl.filter(function(t) { return t.sym.toLowerCase().indexOf(sym) > -1; });
  if (typ) fl = fl.filter(function(t) { return t.type === typ; });
  if (brk) fl = fl.filter(function(t) { return t.broker === brk; });
  if (res === "w") fl = fl.filter(function(t) { return t.pnl > 0; });
  if (res === "l") fl = fl.filter(function(t) { return t.pnl < 0; });
  if (fa) fl = fl.filter(function(t) { return t.date >= fa; });
  if (fb) fl = fl.filter(function(t) { return t.date <= fb; });
  var tot = fl.length, pages = Math.max(1, Math.ceil(tot / PER));
  if (pg > pages) pg = 1;
  var sl = fl.slice((pg - 1) * PER, pg * PER);
  if (!tot) {
    document.getElementById("tb").innerHTML = "<div style='text-align:center;padding:30px;color:var(--muted)'>Sin resultados</div>";
    document.getElementById("pag").innerHTML = "";
    return;
  }
  var rows = sl.map(function(t) {
    var col = t.pnl >= 0 ? "var(--green)" : "var(--orange)";
    return "<tr><td><strong>" + t.sym + "</strong></td><td><span class='pill " + typePill(t.type) + "'>" + t.type + "</span></td><td><span class='pill pill-" + (t.broker||"qf") + "'>" + (t.broker||"qf").toUpperCase() + "</span></td><td style='color:var(--muted)'>" + t.date + "</td><td style='font-weight:800;color:" + col + "'>" + f(t.pnl) + "</td></tr>";
  }).join("");
  document.getElementById("tb").innerHTML = "<table><thead><tr><th>Símbolo</th><th>Tipo</th><th>Broker</th><th>Fecha</th><th>P&L</th></tr></thead><tbody>" + rows + "</tbody></table>";
  var p = "<span style='color:var(--muted)'>" + tot + " ops</span>&nbsp;";
  if (pages > 1) for (var i = 1; i <= pages; i++) p += "<button class='pb" + (i === pg ? " on" : "") + "' onclick='pg=" + i + ";tbl()'>" + i + "</button>";
  document.getElementById("pag").innerHTML = p;
}

// ========== MODAL (LOCAL EXTRAS) ==========
function openM() {
  document.getElementById("mD").value = new Date().toISOString().split("T")[0];
  document.getElementById("modal").classList.add("on");
}
function closeM() { document.getElementById("modal").classList.remove("on"); }
function addM() {
  var sym = document.getElementById("mS").value.trim().toUpperCase();
  var date = document.getElementById("mD").value;
  var pnl = parseFloat(document.getElementById("mP").value);
  if (!sym || !date || isNaN(pnl)) { alert("Símbolo, fecha y P&L obligatorios."); return; }
  var t = { sym: sym, date: date, pnl: pnl, type: document.getElementById("mT").value, broker: document.getElementById("mBrok").value, src: "local" };
  extras.push(t);
  trades.push(t);
  try { localStorage.setItem("trady_extras", JSON.stringify(extras)); } catch(e) {}
  go();
  closeM();
  ["mS", "mD", "mP"].forEach(function(id) { document.getElementById(id).value = ""; });
}
function delLast() {
  if (!extras.length) { alert("No hay trades locales."); return; }
  var last = extras[extras.length - 1];
  if (confirm("Eliminar: " + last.sym + " " + last.date + " " + last.pnl + "?")) {
    extras.pop();
    trades = trades.filter(function(t) { return t.src !== "local"; });
    extras.forEach(function(x) { trades.push(x); });
    try { localStorage.setItem("trady_extras", JSON.stringify(extras)); } catch(e) {}
    go();
  }
}

// ========== INIT ==========
loadSheet();
</script>
